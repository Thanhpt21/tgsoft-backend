# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  backend:
    build: .
    container_name: tgsoft-backend-prod
    ports:
      - "8080:8080"
    env_file:
      - .env.prod                 # ĐỔI THÀNH .env.prod
    environment:
      - REDIS_HOST=redis
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped